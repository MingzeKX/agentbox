[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentbox"
version = "0.1.0"
description = "QEMU-sandboxed AI agent: FastAPI AI service + control plane + Debian minimal sandbox executor + pgvector tool registry"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3.0",
    "jsonschema>=4.22",
    "rich>=13.7",
    # interactive console: completion + history for `agent chat`
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.0"]
# Real-time voice mode of `agent chat --voice`: microphone capture + energy VAD.
# Both are imported lazily, so the console works without them (it just says
# "sounddevice 未安装" instead of recording).  numpy is used when a device refuses
# 16 kHz and the recording has to be resampled.
voice = ["sounddevice>=0.5", "numpy>=1.26"]
asr = [
    "faster-whisper>=1.2",
    # PyAV 19 removed the metadata_errors kwarg that faster-whisper 1.2.1 still passes,
    # so ASR dies with "TypeError: open() got an unexpected keyword argument". Pin below 19.
    "av<19",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agent = "agent.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "sandbox: requires a bootable QEMU sandbox (KVM/WHPX/TCG) and a built sandbox image",
    "pg: requires a reachable PostgreSQL with the pgvector extension",
    "slow: long running",
]
filterwarnings = ["ignore::DeprecationWarning"]
# Keep pytest's scratch directories inside var/ (gitignored) and delete them
# afterwards: otherwise the workspace root collects tmp*/ and pytest-of-*/ dirs.
tmp_path_retention_policy = "none"
addopts = "--basetemp=var/pytest-tmp"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# E501: the code is formatted at ~120 columns by hand.
# B008: pydantic/depends style calls in defaults are intentional.
# ASYNC109: we deliberately accept a `timeout` argument and pass it to wait_for.
# ASYNC230: opening a log file handle before spawning QEMU is intentional.
ignore = ["E501", "B008", "ASYNC109", "ASYNC230"]
